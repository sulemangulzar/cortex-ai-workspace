services:
  - type: web
    name: cortex-studio-api
    runtime: docker
    rootDir: backend
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 15
      - key: REFRESH_TOKEN_EXPIRE_MINUTES
        value: 10080
      - key: COOKIE_SECURE
        value: true
      - key: COOKIE_SAMESITE
        value: none
      - key: OPENAI_API_KEY
        sync: false
      - key: CREWAI_MODEL
        value: openai/gpt-4o-mini
      - key: CREWAI_ENABLED
        value: true
      - key: SUPABASE_S3_ENDPOINT
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: auto
      - key: BUCKET_NAME
        sync: false
      - key: MAX_UPLOAD_SIZE_BYTES
        value: 104857600
